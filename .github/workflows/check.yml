# yaml-language-server: $schema=https://schemastore.org/github-workflow
jobs:
  check:
    runs-on: ${{ matrix.os }}
    steps:
      - name: Inspect installed GCC targets
        run: |
          Get-Command gcc, g++ -All -ErrorAction SilentlyContinue |
            Select-Object Name, Source

          $roots = @('C:\mingw64', 'C:\msys64', 'C:\Strawberry\c')
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*gcc.exe' |
                ForEach-Object {
                  Write-Host "`nCompiler: $($_.FullName)"
                  & $_.FullName -dumpmachine
                }
            }
          }
        shell: pwsh
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@main
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          actions-cache-folder: ${{ runner.temp }}/xmake
      - if: ${{ runner.arch == 'arm64' }}
        run: xmake format:check
      - uses: qwertycxz/setup-cim@7c20746d99fe17535118b7d0edd6a75c0ab268a8
      - if: ${{ runner.arch == 'arm64' }}
        run: xmake check syntax
      - run: xmake pack
      - uses: actions/upload-artifact@main
        with:
          archive: false
          path: build/xpack/msix/*
    strategy:
      matrix:
        os:
          - windows-11-arm
          - windows-2025
on:
  pull_request:
  push:
    branches:
      - '**'
permissions:
  contents: read
